name: Release

# Run by hand from the Actions tab, on main. See RELEASING.md.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Pick the version
        id: version
        run: echo "version=$(node scripts/release-version.ts $(git tag --list 'v*'))" >> "$GITHUB_OUTPUT"
      # Tagging first means a run that fails later never hands its version to another commit.
      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Only needed until trusted publishing is set up on npmjs.com; see RELEASING.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "Linker-Edit $VERSION" --generate-notes
