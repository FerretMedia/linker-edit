name: Release

# Run by hand from the Actions tab, on main. See RELEASING.md.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Picks the version from today's date and the time. Nothing is tagged until every installer has built.
  version:
    name: Version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pick the version
        id: version
        run: node scripts/release-version.ts >> "$GITHUB_OUTPUT"

  # Each installer is built on its own platform: the agents' programs are installed per platform and architecture.
  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: macOS Apple silicon
            os: macos-latest
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stamp the version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version
      - run: npm run build
      - name: Build the installer
        run: node scripts/build-desktop.ts
        env:
          # Optional. Unset, Windows builds are unsigned and Mac builds are signed ad hoc; see RELEASING.md.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # Nothing is published until every installer has built.
  publish:
    name: Publish
    needs: [version, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/desktop
      - name: Gather the installers
        run: node scripts/release-assets.ts "$RUNNER_TEMP/desktop" "$RUNNER_TEMP/assets"
      # A day has one release: releasing again that day replaces it, tag and all.
      - name: Replace today's earlier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$NAME" > /dev/null 2>&1; then
            gh release delete "v$NAME" --cleanup-tag --yes
          fi
          git push origin --delete "v$NAME" 2> /dev/null || true
      # The installed apps update from this release's latest*.yml files.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$NAME" "$RUNNER_TEMP"/assets/* --target "$GITHUB_SHA" --title "Linker-Edit $NAME" --generate-notes
      # npm refuses provenance from a private repository, so the package waits until the repo is public.
      - name: Stamp the version
        if: ${{ !github.event.repository.private }}
        run: npm version "$VERSION" --no-git-tag-version
      - if: ${{ !github.event.repository.private }}
        run: npm run build
      - name: Publish to npm
        if: ${{ !github.event.repository.private }}
        run: npm publish --provenance --access public
        env:
          # Only needed until trusted publishing is set up on npmjs.com; see RELEASING.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
