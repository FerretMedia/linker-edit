name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Resolve action snapshot needs a davinci-resolve-mcp checkout and is skipped here.
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
