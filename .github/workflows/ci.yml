name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; main and releases check every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Windows too: it's where most Resolve users are, and where path handling breaks.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only on a cache miss; the system libraries it needs always install.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Installs the npm package the way users get it and starts it, so a broken bundle or a missing file never ships.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install and start the package
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app"
          # No Resolve here: the app starts anyway, and its status says Resolve Studio is missing.
          cat > "$RUNNER_TEMP/config.json" <<EOF
          { "port": 4390, "workspaceDir": "$RUNNER_TEMP/workspace", "projectsDir": "$RUNNER_TEMP/projects" }
          EOF
          cd "$app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/linker-edit-*.tgz
          npx linker-edit --version
          # Agents start the "linker" MCP server from the package's own bundle.
          tools=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node node_modules/linker-edit/dist/linker-mcp.js)
          echo "$tools" | grep -q '"transcribe"'
          echo "$tools" | grep -q '"create_timeline"'
          # The Resolve scripts ship in the package, where the server reads them.
          test -f node_modules/linker-edit/server/resolve/scripts/tool_add_clips.py
          # No display here for the app window, so it uses the browser path.
          LINKER_EDIT_CONFIG="$RUNNER_TEMP/config.json" npx linker-edit --browser > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4390/ | grep -q "<html" || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          kill "$server"
          cat "$RUNNER_TEMP/server.log"

  # Builds the Linux desktop app the way releases do and starts it, so a missing file or a helper process
  # that can't run inside the app is caught before a release. Release builds the installers for every platform.
  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-desktop.ts --dir
      - name: Start the app
        run: |
          app=release/linux-unpacked/linker-edit
          cat > "$RUNNER_TEMP/config.json" <<EOF
          { "port": 4391, "workspaceDir": "$RUNNER_TEMP/workspace", "projectsDir": "$RUNNER_TEMP/projects" }
          EOF
          # Agents start the "linker" MCP server with the app's own binary, run as Node.
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ELECTRON_RUN_AS_NODE=1 "$app" release/linux-unpacked/resources/app/dist/linker-mcp.js | grep -q '"create_timeline"'
          test -f release/linux-unpacked/resources/app/server/resolve/scripts/tool_add_clips.py
          # No setuid sandbox helper in an unpacked build, and no display without xvfb.
          LINKER_EDIT_CONFIG="$RUNNER_TEMP/config.json" xvfb-run -a "$app" --no-sandbox > "$RUNNER_TEMP/app.log" 2>&1 &
          curl --silent --fail --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:4391/ | grep -q "<html" || {
            cat "$RUNNER_TEMP/app.log" ~/.config/Linker-Edit/logs/server.log
            exit 1
          }
          cat ~/.config/Linker-Edit/logs/server.log

  # The one check to require before merging. It fails when any job above fails, is cancelled or is
  # skipped, so adding or splitting jobs needs no change to the merge rules. Add every job to `needs`.
  check:
    name: Check
    if: ${{ always() }}
    needs: [typecheck, test, e2e, package, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
