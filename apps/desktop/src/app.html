<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linker-Edit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Before first paint, so the theme never flashes.
      // The theme picked in Settings (src/lib/theme.ts), or the system's.
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const picked = () => {
        try {
          return localStorage.getItem("linker-edit.theme");
        } catch {
          return null;
        }
      };
      const apply = () => {
        const theme = picked();
        document.documentElement.classList.toggle("dark", theme === "dark" || (theme !== "light" && dark.matches));
      };
      apply();
      dark.addEventListener("change", apply);
      // In the desktop window the page's top headers are the title bar (desktop/main.ts).
      const titleBar = window.linkerEditDesktop?.titleBar;
      if (titleBar) document.documentElement.dataset.titleBar = titleBar;
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
