# XcodeGen spec: `xcodegen generate` writes LinkerEdit.xcodeproj (not committed) and LinkerEdit/Info.plist.
name: LinkerEdit
options:
  bundleIdPrefix: cool.linker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LinkerEditKit:
    path: Packages/LinkerEditKit
targets:
  LinkerEdit:
    type: application
    platform: iOS
    sources:
      - path: LinkerEdit
        excludes:
          - Info.plist
    dependencies:
      - package: LinkerEditKit
    info:
      path: LinkerEdit/Info.plist
      properties:
        CFBundleDisplayName: Linker-Edit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Hosts on this network or this Mac (the simulator) are often plain http, such as http://127.0.0.1:4317.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Linker-Edit connects to the Linker-Edit app on your edit computer.
        # Linker sign-in comes back to linkeredit://oauth/callback.
        CFBundleURLTypes:
          - CFBundleURLName: cool.linker.edit.oauth
            CFBundleURLSchemes:
              - linkeredit
        # Empty until Linker registers the iPad app at Clerk; sign-in with Linker stays off until then.
        LinkerOAuthClientID: ""
        LinkerOAuthIssuer: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.linker.edit.ipad
        PRODUCT_NAME: LinkerEdit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  LinkerEditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LinkerEditUITests
    dependencies:
      - target: LinkerEdit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.linker.edit.ipad.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LinkerEdit:
    build:
      targets:
        LinkerEdit: all
        LinkerEditUITests: [test]
    test:
      targets:
        - name: LinkerEditUITests
          parallelizable: false
      gatherCoverageData: false
