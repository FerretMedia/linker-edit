[package]
name = "linker-edit-server"
description = "The Linker-Edit server: all state, agents, Resolve, /ws and /api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
linker-edit-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
async-trait = "0.1"
base64 = "0.22"
chrono.workspace = true
futures = "0.3"
gethostname = "1"
getrandom = "0.3"
http = "1"
icu_collator = "2.4"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
reqwest.workspace = true
# The built Svelte UI inside the binary (assets::web_file); read from disk in debug builds.
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Fresh folders for view_frames, as fs.mkdtemp.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tracing.workspace = true
unicode-normalization = "0.1"
url = "2"
uuid.workspace = true

[dev-dependencies]
# The /ws client in http's tests.
tokio-tungstenite = "0.28"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
