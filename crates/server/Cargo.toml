[package]
name = "linker-edit-server"
description = "The Linker-Edit server: all state, agents, Resolve, /ws and /api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linker-edit-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
# preserve_order: objects keep their keys in order, like JavaScript's, so the JSON scripts and agents get is the same.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
getrandom = "0.3"
async-trait = "0.1"
chrono.workspace = true
indexmap = { version = "2", features = ["serde"] }
regex = "1"
# Fresh folders for view_frames, as fs.mkdtemp.
tempfile.workspace = true
thiserror.workspace = true
tokio-util = "0.7"
