[package]
name = "linker-edit-ui"
description = "The GPUI window: one client of the server, like the browser UI"
version.workspace = true
edition.workspace = true
license.workspace = true

# Why GPUI comes through gpui-kit 0.10.0, pinned exactly:
# - gpui-kit is Longbridge's facade over GPUI + gpui-component (inputs, virtual lists,
#   scrolling, dialogs, menus, tooltips, markdown, resizable panes, title bar) and the
#   Lucide icon assets. Its 0.10.0 pins the GPUI it was tested with: `gpui-pre` =0.3.12,
#   a crates.io snapshot of zed-industries/zed@d2a4fb6, plus `gpui-pre-platform` =0.3.12.
# - crates.io `gpui` 0.2.2 is a frozen Oct 2025 snapshot that no current gpui-component
#   builds on, and a git pin of zed would need a matching gpui-component git rev by hand.
#   This gives the same "one known-good Zed commit" from crates.io, with checksums.
# - Upgrade on purpose: bump gpui-kit, which moves gpui-pre with it, then run the UI tests
#   and look at the window on Windows. Licenses: all Apache-2.0, icons ISC (see NOTICE).
[dependencies]
gpui-kit = "=0.10.0"
linker-edit-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
# Tool inputs keep the agent's key order when shown, as JSON.stringify does.
serde_json = { workspace = true, features = ["preserve_order"] }
# The link to the server is a pair of channels; GPUI awaits them on its own executor.
futures = "0.3"
# Single instance: a local socket (named pipe on Windows) the first copy listens on.
interprocess = "2"
# Only to turn the agent's soft line breaks into hard ones and images into their alt text before
# gpui-component's markdown view draws it, as marked does with `breaks: true` (see markdown.rs).
pulldown-cmark = { version = "0.13", default-features = false }
# The sidebar's search folds accents away, as sidebar.ts does with NFKD.
unicode-normalization = "0.1"
# The `/ws` client for another computer's server (transport.rs): its own thread with a small tokio
# runtime, feeding the same channels as `Link::pair()`. wss for Linker Connect goes through rustls
# with the OS's roots; ring is installed as the provider explicitly, so it works whichever other
# provider (reqwest's aws-lc-rs) the binary also links.
tokio = { workspace = true }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The computer menu asks this computer's server for the user's other computers, and a Linker
# Connect computer for a session (computer_picker.rs): a few requests, blocking, off the UI thread.
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Lets the first copy's window come to the front when a second copy hands over.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
